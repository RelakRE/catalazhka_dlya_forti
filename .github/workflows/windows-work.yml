name: Windows Work
on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows-work.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows-work.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify source, network simulation and native application
        run: ./test-work.ps1
      - name: Upload native offline report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-work-validation
          path: windows/build/work-tests/*/WINDOWS-VALIDATION.json
          if-no-files-found: ignore
