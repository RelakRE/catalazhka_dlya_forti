name: Windows Release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/windows-release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify source, network simulation and native network schema
        run: ./test-work.ps1 -SourceOnly
      - name: Build archive and verify first-run preparation and native offline tests
        id: package
        run: ./build-release.ps1 -SourceCommit $env:GITHUB_SHA
      - name: Attest the Windows archive
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: windows/${{ steps.package.outputs.assets }}/Forti-Split-${{ steps.package.outputs.version }}-Windows-x64.zip
      - name: Verify the archive using Forti Split
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_ASSETS: ${{ steps.package.outputs.assets }}
        run: |
          $package = "Forti-Split-$env:RELEASE_VERSION-Windows-x64"
          $archive = (Resolve-Path "$env:RELEASE_ASSETS/$package.zip").Path
          $app = (Resolve-Path "build/release/$package/Forti Split.exe").Path
          $proof = "$archive.sigstore.json"
          Copy-Item -LiteralPath $env:BUNDLE -Destination $proof
          $test = Start-Process -FilePath $app -ArgumentList @('--verify-release-attestation', ('"' + $archive + '"'), ('"' + $proof + '"')) -WindowStyle Hidden -PassThru
          try {
            if (!$test.WaitForExit(20000)) { $test.Kill(); throw 'Attestation verification timed out' }
            if ($test.ExitCode -ne 0) { throw 'Forti Split rejected the release attestation' }
          } finally { $test.Dispose() }
          $hash = (Get-FileHash -LiteralPath $proof -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($proof))" | Add-Content -LiteralPath "$env:RELEASE_ASSETS/SHA256SUMS.txt" -Encoding utf8
      - name: Publish Windows preview
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_ASSETS: ${{ steps.package.outputs.assets }}
        run: |
          $tag = "windows-v$env:RELEASE_VERSION"
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 2>$null
            if ($LASTEXITCODE -eq 0) { Write-Output "Release $tag already exists."; exit 0 }
          }
          $notesFile = Join-Path $env:RUNNER_TEMP "$tag.md"
          python release_notes.py $env:RELEASE_VERSION $notesFile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $assets = @(Get-ChildItem -LiteralPath $env:RELEASE_ASSETS -File | Select-Object -ExpandProperty FullName)
          gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Forti Split $env:RELEASE_VERSION — Windows x64 Preview" --notes-file $notesFile --prerelease --latest=false
